services:
  db:
    image: mysql:8.4
    container_name: webapi-clientes-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: webapi
      MYSQL_USER: api
      MYSQL_PASSWORD: api_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_dev_password"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
